server:
  port: ${PORT:8080}

spring:
  application:
    name: gestor-pedidos
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER}
          jwk-set-uri: ${SUPABASE_JWKS_URI}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
